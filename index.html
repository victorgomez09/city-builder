<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Builder</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0c1017;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* Barra Superior HUD Unificada y Minimalista */
      #top-bar {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 100;
        display: flex;
        justify-content: center;
      }

      .hud-main-bar {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        background: rgba(15, 20, 26, 0.90);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 7px 20px;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        color: #f1f5f9;
        font-size: 13px;
        font-weight: 500;
      }

      .hud-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .hud-city {
        font-weight: 700;
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hud-city-name {
        color: #ffffff;
        font-size: 13px;
      }
      .hud-badge {
        font-size: 10px;
        font-weight: 700;
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.15);
        border: 1px solid rgba(245, 158, 11, 0.35);
        padding: 2px 7px;
        border-radius: 8px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .hud-divider {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.14);
      }

      .hud-stats {
        gap: 16px;
      }
      .hud-stat-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .hud-stat-val {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .hud-stat-unit {
        font-size: 11px;
        color: #94a3b8;
      }

      .text-green { color: #4ade80; }
      .text-blue  { color: #60a5fa; }
      .text-teal  { color: #2dd4bf; }
      .text-amber { color: #fbbf24; }

      .hud-clock {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: #cbd5e1;
        font-size: 12px;
      }

      .hud-speed-btns {
        display: flex;
        align-items: center;
        gap: 2px;
        background: rgba(255, 255, 255, 0.06);
        padding: 2px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .hud-speed-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        padding: 4px 7px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        line-height: 1;
        transition: all 0.15s ease;
      }
      .hud-speed-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }
      .hud-speed-btn.active {
        background: rgba(56, 189, 248, 0.25);
        color: #38bdf8;
        font-weight: 700;
      }

      /* Widget de Demanda RCI (Inferior Izquierda) */
      #demand-widget {
        position: absolute;
        bottom: 24px;
        left: 20px;
        background: rgba(15, 20, 26, 0.90);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 8px 12px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
        z-index: 90;
      }
      .demand-label {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #78909c;
        text-transform: uppercase;
        margin-right: 4px;
      }
      .demand-bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .demand-bar-bg {
        width: 8px;
        height: 44px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }
      .demand-bar-fill {
        width: 100%;
        border-radius: 4px;
        transition: height 0.3s ease;
      }
      .demand-bar-fill.r { background: #4caf50; height: 65%; }
      .demand-bar-fill.c { background: #2196f3; height: 45%; }
      .demand-bar-fill.i { background: #ff9800; height: 30%; }
      .demand-bar-fill.o { background: #00bcd4; height: 50%; }
      .demand-type {
        font-size: 10px;
        font-weight: 700;
        color: #b0bec5;
      }

      /* Atajos de Teclado (Inferior Derecha) */
      #shortcuts-widget {
        position: absolute;
        bottom: 24px;
        right: 20px;
        background: rgba(18, 22, 28, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 6px 16px;
        font-size: 12px;
        color: #90a4ae;
        display: flex;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
        z-index: 90;
      }
      .key-tag {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
      }

      /* Barra de Herramientas Principal */
      #main-toolbar {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
      }
      .toolbar-wrapper {
        display: flex;
        gap: 8px;
        background: rgba(18, 22, 28, 0.94);
        padding: 6px 10px;
        border-radius: 36px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(16px);
      }
      .main-tool-btn {
        background: transparent;
        color: #b0bec5;
        border: none;
        padding: 10px 18px;
        border-radius: 24px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .main-tool-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
      }
      .main-tool-btn.active {
        background: #1976d2;
        color: #ffffff;
        box-shadow: 0 0 16px rgba(25, 118, 210, 0.65);
      }

      /* Subpanel de Carreteras con Modos de Trazado */
      #road-panel {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 16px 22px;
        color: #fff;
        z-index: 95;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(16px);
        display: none;
        flex-direction: column;
        gap: 12px;
        min-width: 490px;
      }
      .panel-section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #64b5f6;
      }
      .draw-mode-buttons, .road-type-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-start;
      }
      .draw-mode-btn, .road-type-btn {
        background: #263238;
        color: #cfd8dc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .draw-mode-btn:hover, .road-type-btn:hover {
        background: #37474f;
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .draw-mode-btn.active {
        background: #1976d2;
        color: #ffffff;
        border-color: #42a5f5;
        box-shadow: 0 0 12px rgba(25, 118, 210, 0.5);
      }
      .road-type-btn.active {
        background: #00897b;
        color: #ffffff;
        border-color: #26a69a;
        box-shadow: 0 0 12px rgba(0, 137, 123, 0.5);
      }
      .road-info {
        font-size: 12px;
        color: #80cbc4;
        text-align: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        border-radius: 6px;
      }

      /* Panel de Terraformación */
      #terraform-panel {
        position: absolute;
        bottom: 84px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 24, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 16px 22px;
        color: #fff;
        z-index: 95;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(16px);
        display: none;
        flex-direction: column;
        gap: 12px;
        min-width: 390px;
      }
      .panel-header {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #64b5f6;
        text-align: center;
      }
      .tool-buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .tool-btn {
        background: #263238;
        color: #cfd8dc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .tool-btn:hover {
        background: #37474f;
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .tool-btn.active {
        background: #00acc1;
        color: #ffffff;
        border-color: #26c6da;
        box-shadow: 0 0 12px rgba(0, 172, 193, 0.5);
      }
      .brush-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .control-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: #b0bec5;
      }
      .control-row input[type="range"] {
        width: 180px;
        cursor: pointer;
        accent-color: #00e5ff;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- Barra Superior HUD Unificada y Minimalista -->
    <header id="top-bar">
      <div class="hud-main-bar">
        <!-- Identidad de la Ciudad -->
        <div class="hud-group hud-city">
          <span>🏛️</span>
          <span class="hud-city-name">New Fable</span>
          <span id="hud-milestone" class="hud-badge">PIONERO</span>
        </div>

        <div class="hud-divider"></div>

        <!-- Estadísticas Principales -->
        <div class="hud-group hud-stats">
          <div class="hud-stat-item" title="Presupuesto Municipal">
            <span>💵</span>
            <span id="hud-money" class="hud-stat-val text-green">$50,000</span>
          </div>

          <div class="hud-stat-item" title="Población Habitante">
            <span>👥</span>
            <span id="hud-pop" class="hud-stat-val text-blue">0</span>
            <span class="hud-stat-unit">hab</span>
          </div>

          <div class="hud-stat-item" title="Felicidad Ciudadana">
            <span>😊</span>
            <span id="hud-happy" class="hud-stat-val text-teal">85%</span>
          </div>

          <div class="hud-stat-item" title="Macro-Parcelas Desbloqueadas">
            <span>🗺️</span>
            <span id="hud-tiles" class="hud-stat-val">1/16</span>
            <span class="hud-stat-unit">parcelas</span>
          </div>
        </div>

        <div class="hud-divider"></div>

        <!-- Reloj y Control de Simulación -->
        <div class="hud-group hud-time-controls">
          <span id="hud-time" class="hud-clock">🕒 14:15</span>
          <div class="hud-speed-btns">
            <button id="btn-speed-pause" class="hud-speed-btn" title="Pausar (Espacio)">⏸️</button>
            <button id="btn-speed-1" class="hud-speed-btn active" title="Velocidad 1x">▶️</button>
            <button id="btn-speed-2" class="hud-speed-btn" title="Velocidad 2x">⏩</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Widget de Demanda RCI -->
    <div id="demand-widget">
      <span class="demand-label">Demanda</span>
      <div class="demand-bar-col">
        <div class="demand-bar-bg"><div class="demand-bar-fill r"></div></div>
        <span class="demand-type">R</span>
      </div>
      <div class="demand-bar-col">
        <div class="demand-bar-bg"><div class="demand-bar-fill c"></div></div>
        <span class="demand-type">C</span>
      </div>
      <div class="demand-bar-col">
        <div class="demand-bar-bg"><div class="demand-bar-fill i"></div></div>
        <span class="demand-type">I</span>
      </div>
      <div class="demand-bar-col">
        <div class="demand-bar-bg"><div class="demand-bar-fill o"></div></div>
        <span class="demand-type">O</span>
      </div>
    </div>

    <!-- Atajos de Teclado -->
    <div id="shortcuts-widget">
      <span><span class="key-tag">WASD</span> Desplazar</span>
      <span><span class="key-tag">Rueda</span> Zoom</span>
      <span><span class="key-tag">Espacio</span> Pausa</span>
    </div>

    <script type="module">
      import { Engine } from './src/main.ts';
      const container = document.getElementById('canvas-container');
      if (container) {
        const engine = new Engine(container);
        engine.start();
      }
    </script>
  </body>
</html>
