<meta charset="utf-8">
<title>Vira City</title>
<meta name="description" content="Vira City: a browser city builder with real traffic, lanes, intersections, bikes, buses and trains.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   Vira City — Cities: Skylines Style Clean Theme & Ergonomic Layout
   ========================================================================== */
:root {
  --ink: #0b1118;
  --panel: rgba(13, 20, 28, 0.92);
  --panel-solid: #111a24;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.18);
  --fg: #eef3f8;
  --mute: #8e9ea9;
  --accent: #3d8bff;
  --accent-glow: rgba(61, 139, 255, 0.35);
  --accent-2: #ffb547;
  --good: #4fd17a;
  --warn: #ffb547;
  --bad: #ff5d4f;
  --font: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; touch-action: none; }
#view canvas { display: block; }
.ui { position: absolute; }

/* Translucent Glassmorphism Base */
.glass {
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
}

.lbl {
  font-family: var(--cond);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 10.5px;
  color: var(--mute);
  font-weight: 700;
}
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Custom Sleek Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

/* ==========================================================================
   1. TOPBAR: Consolidated Single-Line HUD
   ========================================================================== */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  background: rgba(12, 18, 26, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  gap: 12px;
  z-index: 20;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  pointer-events: none;
  flex-wrap: nowrap;
  white-space: nowrap;
}
.topbar > * { pointer-events: auto; }

.tb-sec {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* City Identity & Milestone Pill */
.cityblk {
  display: flex;
  align-items: center;
  gap: 10px;
}
.cname {
  font-family: var(--cond);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
  line-height: 1;
}
.mile {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s ease-out;
}
.mile:hover {
  background: rgba(61, 139, 255, 0.16);
  border-color: var(--accent);
}
.mbar {
  width: 54px;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
  overflow: hidden;
}
.mbar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), #7fb6ff);
}
.mile span {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg);
}
.mile svg {
  color: var(--mute);
  transition: transform 0.15s;
}
.mile:hover svg {
  color: #fff;
  transform: translateY(1px);
}

/* Vitals & Economics Strip */
.stats-strip {
  display: flex;
  align-items: center;
  gap: 10px;
}
.stat {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.stat b {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.1;
}
.stat small { font-size: 10.5px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.click-stat {
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.click-stat:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--line);
}

/* Zone Demand Meters */
.demand {
  display: flex;
  gap: 3px;
  align-items: flex-end;
  height: 28px;
  padding: 2px 6px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.demand:hover {
  background: rgba(255, 255, 255, 0.06);
  border-color: var(--line);
}
.dbar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: 14px;
}
.dbar .track {
  width: 8px;
  height: 18px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.dbar .track i {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  border-radius: 2px;
  transition: height 0.4s;
}
.dbar span {
  font-family: var(--cond);
  font-size: 9px;
  font-weight: 700;
  color: var(--mute);
  line-height: 1;
}
.dbar.off { opacity: 0.25; }

/* Clock & Simulation Controls */
.clock {
  display: flex;
  align-items: center;
  gap: 10px;
}
.clock .t {
  font-size: 16px;
  font-weight: 700;
  font-family: var(--cond);
  line-height: 1;
}
.speed {
  display: flex;
  gap: 2px;
}
.speed button {
  width: 28px;
  height: 26px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  border-radius: 5px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.12s;
}
.speed button:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.speed button.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.speed svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
}

/* Quick Management Menu */
.menu {
  display: flex;
  align-items: center;
  gap: 3px;
}
.mbtn {
  height: 32px;
  padding: 0 9px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--cond);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11.5px;
  color: var(--mute);
  transition: all 0.15s;
}
.mbtn:hover {
  background: rgba(255, 255, 255, 0.06);
  color: var(--fg);
}
.mbtn.on {
  background: rgba(61, 139, 255, 0.2);
  color: #fff;
  border-color: rgba(61, 139, 255, 0.45);
}
.mbtn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ==========================================================================
   2. GOALS & MILESTONES DRAWER (Positioned under milestone pill, non-overlapping)
   ========================================================================== */
.goals {
  position: fixed;
  top: 54px;
  left: 12px;
  width: 310px;
  padding: 12px 14px;
  border-radius: 10px;
  z-index: 18;
  box-shadow: 0 12px 36px rgba(0,0,0,0.5);
  animation: panelSlideDown 0.15s ease-out;
}
.goals-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.goals-head h4 {
  margin: 0;
  font-family: var(--cond);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-2);
}
.goals ol {
  margin: 0;
  padding-left: 18px;
  display: grid;
  gap: 5px;
  font-size: 12.5px;
  line-height: 1.35;
}
.goals li.done {
  color: var(--mute);
  text-decoration: line-through;
  opacity: 0.7;
}
.goals li.cur {
  color: #fff;
  font-weight: 600;
}

/* ==========================================================================
   3. BOTTOM TOOLBAR: Command HUD (Centered at bottom)
   ========================================================================== */
.toolbar {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 6px;
  border-radius: 12px;
  background: rgba(12, 18, 26, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  z-index: 22;
  max-width: calc(100vw - 20px);
  overflow-x: auto;
}
.tbtn {
  width: 64px;
  height: 56px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--mute);
  flex: none;
  position: relative;
  transition: all 0.15s;
}
.tbtn::before {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 14px;
  right: 14px;
  height: 3px;
  border-radius: 2px;
  background: transparent;
  transition: all 0.2s;
}
.tbtn:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}
.tbtn.on {
  background: rgba(61, 139, 255, 0.18);
  border-color: rgba(61, 139, 255, 0.4);
  color: #fff;
}
.tbtn.on::before {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.tbtn svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tbtn span {
  font-family: var(--cond);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.tbtn.danger.on {
  background: rgba(255, 93, 79, 0.22);
  border-color: rgba(255, 93, 79, 0.6);
  color: #ff9e94;
}
.tbtn.danger.on::before {
  background: var(--bad);
  box-shadow: 0 0 8px var(--bad);
}
.sep {
  width: 1px;
  height: 34px;
  background: var(--line);
  margin: 0 4px;
  flex: none;
}

/* ==========================================================================
   4. BUILD SHELF (PALETTE): Docked directly above bottom toolbar
   ========================================================================== */
.palette {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%);
  width: min(920px, calc(100vw - 24px));
  max-height: 225px;
  border-radius: 12px;
  background: rgba(14, 21, 30, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
  z-index: 21;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: shelfPop 0.16s cubic-bezier(0.16, 1, 0.3, 1);
}

.phead-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.03);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  flex-shrink: 0;
}
.pcat-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--cond);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  flex-shrink: 0;
}
.pcat-title svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
}
.ptabs {
  display: flex;
  gap: 3px;
  align-items: center;
  margin: 0 auto;
}
.ptab {
  border: 1px solid transparent;
  background: none;
  cursor: pointer;
  padding: 4px 11px;
  border-radius: 6px;
  font-family: var(--cond);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--mute);
  white-space: nowrap;
  transition: all 0.15s;
}
.ptab:hover {
  color: var(--fg);
  background: rgba(255, 255, 255, 0.05);
}
.ptab.on {
  color: #fff;
  background: rgba(61, 139, 255, 0.2);
  border-color: rgba(61, 139, 255, 0.4);
}
.ptab.dim { opacity: 0.45; }

.pmode {
  display: flex;
  gap: 2px;
  align-items: center;
}
.pmode button {
  width: 28px;
  height: 26px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--mute);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.12s;
}
.pmode button:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}
.pmode button.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.pmode svg { display: block; width: 14px; height: 14px; stroke: currentColor; fill: none; }

.pclose {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 0;
  background: transparent;
  color: var(--mute);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: all 0.12s;
}
.pclose:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.cards {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 12px;
  align-items: stretch;
}
.card {
  width: 108px;
  flex: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
  border-radius: 8px;
  padding: 6px;
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.06);
}
.card.on {
  border-color: var(--accent);
  background: rgba(61, 139, 255, 0.18);
  box-shadow: 0 0 12px rgba(61, 139, 255, 0.35);
}
.card .sw {
  height: 56px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
}
.card .sw svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: rgba(255, 255, 255, 0.92);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.card .sw svg[preserveAspectRatio] { width: 100%; height: 100%; stroke: none; }
.card .sw img, .ucard .sw img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card b {
  font-size: 11.5px;
  line-height: 1.2;
  font-weight: 600;
  min-height: 28px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card small {
  font-size: 10.5px;
  color: var(--accent-2);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.card.locked {
  cursor: not-allowed;
  opacity: 0.45;
}
.card.locked small { color: var(--mute); }
.card .lock {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 9.5px;
  font-family: var(--cond);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: rgba(0, 0, 0, 0.75);
  padding: 1px 5px;
  border-radius: 4px;
  color: #fff;
  z-index: 1;
}
.tbtn.new::after, .ptab.new::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 0 2px var(--panel-solid);
}
.card .lock.newb { background: var(--accent-2); color: #1a1205; font-weight: 700; }

/* ==========================================================================
   5. INSPECTOR & SIDE PANELS: Clean Slots (No Overlap)
   ========================================================================== */
.panel {
  position: fixed;
  top: 54px;
  max-height: calc(100vh - 145px);
  overflow-y: auto;
  padding: 14px 16px;
  border-radius: 10px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  z-index: 17;
}
.panel.left {
  left: 12px;
  width: 340px;
  animation: panelSlideLeft 0.15s ease-out;
}
.panel.right {
  right: 12px;
  width: 360px;
  animation: panelSlideRight 0.15s ease-out;
}
.panel h3 {
  margin: 0;
  font-family: var(--cond);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.1;
  text-wrap: balance;
}
.panel .sub { color: var(--mute); font-size: 12.5px; margin-top: 2px; }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.x { background: none; border: 0; color: var(--mute); cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 4px; }
.x:hover { color: var(--fg); }
.sec { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; display: grid; gap: 7px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
.row > span:first-child { color: var(--mute); }
.row b { font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; flex: 1; max-width: 140px; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.stars { letter-spacing: 2px; color: var(--accent-2); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }
.chip.bad { background: rgba(255,93,79,0.16); color: #ffb0a8; }
.chip.warn { background: rgba(255,181,71,0.16); color: #ffd79c; }
.chip.good { background: rgba(79,209,122,0.14); color: #a8efbf; }
.btn { height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); cursor: pointer; font-weight: 600; font-size: 12.5px; transition: all 0.12s; }
.btn:hover { background: rgba(255,255,255,0.1); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #5a9dff; }
.btn.danger { color: #ffb0a8; border-color: rgba(255,93,79,0.4); }
.btn.danger:hover { background: rgba(255,93,79,0.2); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }

/* Intersection Editor */
.jdia { width: 160px; height: 160px; display: block; margin: 10px auto 0; }
.appr { display: grid; gap: 4px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.appr:last-child { border-bottom: 0; }
.appr .an { font-size: 13px; font-weight: 600; }
.appr .an small { color: var(--mute); font-weight: 500; margin-left: 4px; }
.lanes { display: flex; gap: 6px; flex-wrap: wrap; }
.lane { display: flex; gap: 2px; padding: 3px; background: #2a2e34; border-radius: 6px; border-left: 2px dashed rgba(255,255,255,0.35); }
.lane button { width: 26px; height: 26px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 15px; line-height: 1; }
.lane button.on { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.25); }

/* Transit Lines */
.tlines { max-height: calc(100vh - 330px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
.tline { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: rgba(255,255,255,0.025); }
.tline.editing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.tline.broken { border-color: var(--bad); }
.tl-head { display: flex; align-items: center; gap: 6px; }
.tl-head input[type=color] { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }

/* Budget & Taxes */

/* Settings */
